name: run-tox
on:
  push:
    branches:
      - stable/2026.1-m3
  pull_request:
env:
  PYTHON_VERSION: "3.12"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Tox
        run: pip install tox
      - name: Run Tox
        run: "tox -e py"
